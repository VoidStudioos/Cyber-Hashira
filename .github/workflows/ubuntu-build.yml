name: Ubuntu Build & Distribution

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-ubuntu:
    name: Package Ubuntu Desktop Host (DEB & AppImage)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Package All Verified Module Artifacts
        run: python3 scripts/build_modules.py

      - name: Run Modular Verification Test Suites (30 Modules)
        run: |
          python3 tests/test_modular_lifecycle.py
          python3 tests/test_web_security_module.py
          python3 tests/test_network_security_module.py
          python3 tests/test_vulnerability_module.py
          python3 tests/test_hashira_ai_module.py
          python3 tests/test_threat_intel_module.py
          python3 tests/test_forensics_module.py
          python3 tests/test_api_security_module.py
          python3 tests/test_tls_cryptography_module.py
          python3 tests/test_github_actions_module.py
          python3 tests/test_container_security_module.py
          python3 tests/test_wireless_security_module.py
          python3 tests/test_canbus_security_module.py
          python3 tests/test_network_forensics_pcap_module.py
          python3 tests/test_sensor_coverage_module.py
          python3 tests/test_email_security_module.py
          python3 tests/test_sbom_dependency_module.py
          python3 tests/test_secrets_leak_module.py
          python3 tests/test_cloud_iac_module.py
          python3 tests/test_sigma_threat_hunting_module.py
          python3 tests/test_identity_hygiene_module.py
          python3 tests/test_csp_headers_module.py
          python3 tests/test_cors_websocket_module.py
          python3 tests/test_cookie_session_module.py
          python3 tests/test_subdomain_takeover_module.py
          python3 tests/test_ssrf_guard_module.py
          python3 tests/test_graphql_security_module.py
          python3 tests/test_jwt_security_module.py
          python3 tests/test_waf_evasion_module.py
          python3 tests/test_sast_scanner_module.py

      - name: Install Frontend Dependencies
        run: |
          pnpm approve-builds esbuild || true
          pnpm install

      - name: Build Desktop Application
        run: pnpm build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyber-hashira-ubuntu-dist
          path: apps/desktop/dist/
